:root {
  color-scheme: light;
  
  --page: #f5f5f5;               
  --surface: #ffffff;
  --surface-2: #f5f5f5;          
  --surface-3: #e4e4e5;
  --chip: #f1f1f2;               
  --border: #e4e4e5;             
  --border-strong: #d1d2d4;      
  --input-border: #a7a9ac;       
  --ink: #000000;
  --ink-2: #3d3d3d;              
  --muted: #555555;              
  --faint: #a7a9ac;
  --grid: #f1f1f2;
  --accent: #f47920;             
  --accent-hover: #e36c15;
  --accent-ink: #a84f0e;         
  --accent-soft: #fdebdd;        
  
  --series-1: #3557c9; --series-2: #139b89; --series-3: #e2690f; --series-4: #8a5cc8;
  
  --good: #1f9254; --good-ink: #17733f; --good-soft: #eaf6ef;
  --running: #a7a9ac; --stuck: #000000;
  --warning: #f47920; --warning-ink: #a84f0e; --warning-soft: #fdebdd;
  --critical: #b42318; --critical-ink: #b42318; --critical-soft: #fef3f2;
  --code: #f5f5f5;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04);
  --pop-shadow: 0 22px 44px -22px rgba(0, 0, 0, .35);   
  --radius: 10px;                
  --radius-sm: 6px;              
  --radius-xs: 4px;              
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  
  --nav-bg: #ffffff;
  --nav-solid: #ffffff;
  --nav-border: #e4e4e5;
  --nav-ink: #000000;
  --nav-ink-2: #3d3d3d;
  --nav-muted: #555555;
  --nav-hover: rgba(0, 0, 0, 0.04);
  --nav-active: #fdebdd;
  --nav-accent: #f47920;

  
  --gutter: clamp(16px, 2.6vw, 40px);
  --gap: clamp(12px, 1.3vw, 16px);
  --pad: clamp(14px, 1.5vw, 20px);

  --font: "Google Sans Flex", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0a0a0a; --surface: #121212; --surface-2: #1a1a1a; --surface-3: #2a2a2a; --chip: #1f1f1f;
    --border: #242424; --border-strong: #303030; --input-border: #4a4a4a;
    --ink: #f5f5f5; --ink-2: #c9c9c9; --muted: #9a9a9a; --faint: #5c5c5c; --grid: #1c1c1c;
    --accent: #f47920; --accent-hover: #f68a3a; --accent-ink: #f79a52; --accent-soft: #2b1a0d;
    --series-1: #6a82ee; --series-2: #14a593; --series-3: #e2690f; --series-4: #9277e0;
    --good: #34b26f; --good-ink: #5ccf91; --good-soft: #0f2619; --running: #6b6d70; --stuck: #e5e5e5;
    --warning: #f47920; --warning-ink: #f79a52; --warning-soft: #2b1a0d;
    --critical: #f04438; --critical-ink: #fda29b; --critical-soft: #2b1210;
    --shadow: none; --code: #0f0f0f; --pop-shadow: 0 22px 44px -22px rgba(0, 0, 0, .8);
    --nav-bg: #141414; --nav-solid: #141414; --nav-border: #1f1f1f; --nav-ink: #f5f5f5; --nav-ink-2: #c9c9c9;
    --nav-muted: #8a8a8a; --nav-hover: rgba(255, 255, 255, 0.05); --nav-active: #2b1a0d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0a0a0a; --surface: #121212; --surface-2: #1a1a1a; --surface-3: #2a2a2a; --chip: #1f1f1f;
  --border: #242424; --border-strong: #303030; --input-border: #4a4a4a;
  --ink: #f5f5f5; --ink-2: #c9c9c9; --muted: #9a9a9a; --faint: #5c5c5c; --grid: #1c1c1c;
  --accent: #f47920; --accent-hover: #f68a3a; --accent-ink: #f79a52; --accent-soft: #2b1a0d;
  --series-1: #6a82ee; --series-2: #14a593; --series-3: #e2690f; --series-4: #9277e0;
  --good: #34b26f; --good-ink: #5ccf91; --good-soft: #0f2619; --running: #6b6d70; --stuck: #e5e5e5;
  --warning: #f47920; --warning-ink: #f79a52; --warning-soft: #2b1a0d;
  --critical: #f04438; --critical-ink: #fda29b; --critical-soft: #2b1210;
  --shadow: none; --code: #0f0f0f; --pop-shadow: 0 22px 44px -22px rgba(0, 0, 0, .8);
  --nav-bg: #141414; --nav-solid: #141414; --nav-border: #1f1f1f; --nav-ink: #f5f5f5; --nav-ink-2: #c9c9c9;
  --nav-muted: #8a8a8a; --nav-hover: rgba(255, 255, 255, 0.05); --nav-active: #2b1a0d;
}


.label, .nav-label, th, .crumb, .kpi-label, .stat-row .l, .store-grid .l, .cm-label, .client-name small, .rh-eyebrow,
.ab-eyebrow, .ab-col-label, .ab-layer-state, .ab-demo span, .tag.cat, .nav .nav-soon, .cm-soon, .rm-group-tag {
  font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em;
}
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; }
::selection { background: var(--accent-soft); color: var(--ink); }

* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page); color: var(--ink); min-height: 100vh; overflow-x: hidden;
  font: 400 14px/1.5 var(--font); letter-spacing: 0;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
img, svg, canvas { max-width: 100%; }
a { color: inherit; text-decoration: none; }
a.link, .link { color: var(--accent-ink); }
a.link:hover, td a:hover { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: currentColor; text-decoration-thickness: 1px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.mono, code, pre { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
.muted { color: var(--muted); }
.ink-2 { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.nowrap { white-space: nowrap; }


.app { --sb-w: 252px; display: grid; grid-template-columns: var(--sb-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  --ink: var(--nav-ink); --ink-2: var(--nav-ink-2); --muted: var(--nav-muted);
  --surface-2: var(--nav-hover); --border: var(--nav-border);
  color: var(--nav-ink-2);
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
  background: var(--nav-bg); border-right: 1px solid var(--nav-border);
  display: flex; flex-direction: column; padding: 18px 12px 14px; scrollbar-width: none;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 22px; min-width: 0; }
.logo { flex: none; color: var(--nav-ink); display: block; }
.brand-name { font-weight: 600; font-size: 16px; letter-spacing: -0.03em; color: var(--nav-ink); white-space: nowrap; }
.brand-name b { font-weight: 700; color: var(--accent-ink); letter-spacing: -0.01em; }
.nav-section { margin-bottom: 18px; }
.nav-label { font-size: 10.5px; font-weight: 500; color: var(--nav-muted); padding: 0 12px 8px; white-space: nowrap; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: var(--radius-sm);
  color: var(--nav-ink-2); font-weight: 450; margin-bottom: 2px; white-space: nowrap; border: 1px solid transparent;
  transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}

table.env-cols.multi tr:hover td.eb-1 { background: color-mix(in srgb, var(--ink) 6%, var(--surface)); }

/* ---- demo additions ---- */
/* PipelineIQ demo only: the note at the top of each page, toasts, and the About page's client section. */
.demo-boot { padding: 48px; color: var(--muted); font-size: 14px; }
.demo-banner { align-items: center; position: relative; padding-right: 40px; }
.demo-banner .link { color: var(--accent-ink); font-weight: 550; }
.demo-banner-x { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted);
  width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.demo-banner-x:hover { background: var(--surface-2); color: var(--ink); }

.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; max-width: min(420px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 12px 12px 14px; border-radius: var(--radius); background: var(--surface);
  border: 1px solid var(--border-strong); box-shadow: var(--pop-shadow), inset 3px 0 0 var(--accent); font-size: 13px; line-height: 1.5; color: var(--ink-2);
  opacity: 0; transform: translateY(8px); transition: opacity .25s var(--ease), transform .25s var(--ease); }
.toast.in { opacity: 1; transform: none; }
.toast b { color: var(--ink); font-weight: 600; }
.toast-ic svg { width: 16px; height: 16px; margin-top: 2px; stroke: var(--accent-ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.toast button { margin-left: auto; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 6px; width: 22px; height: 22px; flex: none; }
.toast button:hover { background: var(--surface-2); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* Sources: what Collect now means in a demo */
.demo-note { margin-top: var(--gap); }
.demo-note .m { font-weight: 400 !important; font-size: 13px !important; color: var(--ink-2) !important; }

/* About: the fictional client */
.ab-client { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--gap); }
@container content (max-width: 900px) { .ab-client { grid-template-columns: minmax(0, 1fr); } }
.ab-co { padding: var(--pad); display: flex; flex-direction: column; gap: 14px; }
.ab-co-top { display: flex; gap: 14px; align-items: center; }
.ab-co-mark { width: 46px; height: 46px; border-radius: 10px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-weight: 650; font-size: 16px; letter-spacing: .02em; flex: none; }
.ab-co-top b { display: block; font-size: 18px; font-weight: 600; color: var(--ink); }
.ab-co-top small { color: var(--muted); font-size: 12.5px; }
.ab-co p { margin: 0; color: var(--ink-2); line-height: 1.6; }
.ab-co-facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
@container content (max-width: 640px) { .ab-co-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ab-co-facts div { background: var(--surface); padding: 10px 12px; }
.ab-co-facts b { display: block; font-size: 20px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.ab-co-facts span { font-size: 11.5px; color: var(--muted); }
.ab-divs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@container content (max-width: 640px) { .ab-divs { grid-template-columns: minmax(0, 1fr); } }
.ab-divs div { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.ab-divs b { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.ab-divs small { color: var(--muted); font-size: 12px; line-height: 1.45; display: block; }
.ab-need { padding: var(--pad); display: flex; flex-direction: column; gap: 12px; }
.ab-need ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.ab-need li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; }
.ab-need li b { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; }
.ab-need li p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.ab-landscape { padding: var(--pad); }
.ab-land { display: grid; grid-template-columns: minmax(0, 1.1fr) 28px minmax(0, 1fr) 28px minmax(0, .9fr); gap: 8px; align-items: stretch; margin-top: 12px; }
@container content (max-width: 900px) { .ab-land { grid-template-columns: minmax(0, 1fr); } .ab-land .ab-land-arrow { transform: rotate(90deg); height: 20px; } }
.ab-land-col { display: flex; flex-direction: column; gap: 6px; }
.ab-land-col .ab-col-label { margin-bottom: 2px; }
.ab-land-item { display: flex; justify-content: space-between; gap: 10px; border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; color: var(--ink-2); background: var(--surface); }
.ab-land-item b { font-weight: 600; color: var(--ink); }
.ab-land-item span { color: var(--muted); white-space: nowrap; }
.ab-land-arrow { display: grid; place-items: center; color: var(--faint); }
.ab-land-arrow svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ab-fiction { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  M.flowStage = (stage, pipeline) => {

    if (/^RAW|^BASE|\|.*\bBASE\b/.test(s)) return "Base";
    if (/^ENRICHED/.test(s)) return "Enriched";

    if (/Power BI|Analysis Services/.test(s)) return "Power BI";

    const now = Date.now(), cut30 = now - 30 * DAY, out = [];
    const ok = {};
    for (const l of D.loads) if (l.env === env && l.entity_code && l.status_id === 2) (ok[l.entity_code + "|" + l.category] ??= []).push(K.P(l.end_time));
    for (const [key, ts] of Object.entries(ok)) {
      const recent = ts.filter((t) => t >= cut30).sort((a, b) => a - b);
      const all = ts.sort((a, b) => a - b), last = all[all.length - 1];
      if (recent.length < 4 && (now - last) < 40 * DAY) {
        // still judge entities that stopped: use the gaps from their last 30 days of activity
        const hist = all.filter((t) => t >= last - 30 * DAY);
        if (hist.length < 4) continue;
        const gaps = hist.slice(1).map((t, i) => t - hist[i]).filter((g) => g > 30 * 6e4);
        if (gaps.length < 3) continue;
        const limit = Math.max(D.cfg.alerts.stale_hours * HOUR, 3 * K.median(gaps));
        if (now - last > limit) out.push([key, (now - last) / HOUR, limit / HOUR]);
        continue;

      if (recent.length < 4) continue;
      const gaps = recent.slice(1).map((t, i) => t - recent[i]).filter((g) => g > 30 * 6e4);
      if (gaps.length < 3) continue;
      const limit = Math.max(D.cfg.alerts.stale_hours * HOUR, 3 * K.median(gaps));

      else if ((done[d.env + "|" + d.branch] || []).some((t) => t > d.start_time)) { d.result = "Failed · retried"; d.why = "Never completed; a later run of the same branch succeeded"; }

    const n = G.keys.length, dates = bucketDates(G.keys, G.grain), tick = bucketTick(dates, G.grain);
    const every = Math.max(1, Math.ceil(n / Math.max(3, Math.floor((el.clientWidth || 600) / 90))));
    const shade = (v) => v ? `color-mix(in srgb, var(--critical) ${Math.round(22 + 78 * Math.sqrt(v / Math.max(1, G.max)))}%, var(--surface))` : "var(--surface-2)";
    let html = `<div class="heat" style="grid-template-columns: minmax(64px, max-content) repeat(${n}, minmax(0, 1fr)) minmax(34px, max-content)">`;
    G.rows.forEach((r, ri) => {
      html += `<div class="heat-l">${r.stage}</div>`;
      r.cells.forEach((v, i) => { html += `<div class="heat-c${v ? " on" : ""}" data-r="${ri}" data-i="${i}" style="background:${shade(v)}"></div>`; });
      html += `<div class="heat-t">${r.total ? r.total.toLocaleString() : "—"}</div>`;
    });
    html += `<div></div>` + G.keys.map((k, i) => `<div class="heat-x">${i % every === 0 ? [].concat(tick(null, i)).join(" ") : ""}</div>`).join("") + `<div></div></div>`;
    el.innerHTML = html;
    el.querySelectorAll(".heat-c").forEach((c) => {
      const r = G.rows[c.dataset.r], i = +c.dataset.i, v = r.cells[i];
      c.addEventListener("mousemove", (ev) => showTip(`<b>${r.stage}</b>${bucketTitle(dates[i], G.grain)}<br>${v.toLocaleString()} root-cause failure${v === 1 ? "" : "s"}${v && onPick ? "<br>Click to open them" : ""}`, ev));
      c.addEventListener("mouseleave", hideTip);
      if (v && onPick) c.addEventListener("click", () => onPick(G.keys[i], r.stage));
    });
  };

  // One registry: a chart is redrawn on theme change while its canvas is still in the page
  const charts = new Set();
  window.makeChart = function (el, builder) {
    if (!refRegistered && window.Chart) { Chart.register(refLines); refRegistered = true; }
    for (const c of charts) if (c.el === el || !c.el.isConnected) { c.chart.destroy(); charts.delete(c); }
    chartTheme();
    const entry = { el, builder, chart: new Chart(el, builder()) };
    charts.add(entry);
  };
  const redrawAll = () => { for (const c of [...charts]) { if (!c.el.isConnected) { c.chart.destroy(); charts.delete(c); continue; }
    chartTheme(); c.chart.destroy(); c.chart = new Chart(c.el, c.builder()); } };
  document.addEventListener("themechange", redrawAll);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawAll);

  // Gantt of loads within a batch
  // Batch timeline. With opts.lanes the loads are grouped into one lane per step of the flow (Raw, Base, Enriched ...):
  // a lane header shows the whole step at a glance (every load as a thin mark), and opens to one row per load.
  // Lanes with failed or running loads open by themselves; what you open or close is kept across live refreshes.
  window.drawGantt = function (el, rows, t0, opts = {}) {
    const avail = el.clientWidth || 700;
    const rowH = 14, gap = 3, laneH = 26, right = 16, top = 24;
    const left = Math.round(Math.min(280, Math.max(130, avail * 0.3)));
    const maxChars = Math.floor((left - 24) / 6.4);
    const start = parseUtc(t0).getTime(), now = Date.now();
    const spans = rows.map((r) => {
      const s = parseUtc(r.start_time).getTime();
      const e = r.end_time ? parseUtc(r.end_time).getTime() : (r.status_id === 1 ? now : s + (r.duration || 0) * 1000);
      return { ...r, s: (s - start) / 60000, e: Math.max((e - start) / 60000, (s - start) / 60000 + 0.2) };
    });
    const live = opts.live || spans.some((r) => r.status_id === 1);
    const nowM = (now - start) / 60000;
    const maxX = Math.max(1, ...spans.map((r) => r.e), live ? nowM : 0);
    const width = Math.max(avail, 480), plotW = width - left - right;
    const x = (m) => left + (m / maxX) * plotW;
    // succeeded green, failed red, still running grey, anything else (not executed, cancelled) black
    const color = (r) => r.status_id === 3 ? css("--critical") : r.status_id === 1 ? css("--running") : r.status_id === 2 ? css("--good") : css("--stuck");
    const esc = (t) => String(t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const clip = (t, n) => (t.length > n ? t.slice(0, n - 1) + "…" : t);

    // lanes in flow order; anything with an unknown step joins the end
    const lanes = (opts.lanes || [{ key: "*", name: "", what: "" }]).map((l) => ({ ...l, rows: [] }));
    spans.forEach((r) => {
      const l = opts.lanes ? (lanes.find((x) => x.key === (r.category || null)) || lanes.find((x) => x.key === "*")
        || (lanes.push({ key: r.category, name: r.category, what: "", rows: [] }), lanes[lanes.length - 1])) : lanes[0];
      l.rows.push(r);
    });
    const shown = lanes.filter((l) => l.rows.length);
    if (!el._open) el._open = new Set(shown.filter((l) => l.rows.some((r) => r.status_id === 3 || r.status_id === 1)).map((l) => String(l.key)));
    const grouped = !!opts.lanes;

    let y = top, body = "", hits = [];
    shown.forEach((l, li) => {
      const open = !grouped || el._open.has(String(l.key));
      const n = l.rows.length, nf = l.rows.filter((r) => r.status_id === 3).length, nr = l.rows.filter((r) => r.status_id === 1).length;
      const lo = Math.min(...l.rows.map((r) => r.s)), hi = Math.max(...l.rows.map((r) => r.e));
      if (grouped) {
        const cy = y + laneH / 2;
        body += `<g class="g-lane" data-lane="${esc(String(l.key))}" role="button" tabindex="0" aria-expanded="${open}">`;
        body += `<rect x="0" y="${y}" width="${width}" height="${laneH}" rx="6" fill="${css("--surface-2")}"/>`;
        body += `<path d="${open ? `M10 ${cy - 2} l4 4 4-4` : `M12 ${cy - 4} l4 4-4 4`}" stroke="${css("--muted")}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
        body += `<text x="26" y="${cy + 4}" font-size="11.5" font-weight="600" fill="${css("--ink")}">${esc(l.name)}<tspan dx="7" font-weight="400" fill="${css("--muted")}">${esc(clip(l.what, Math.max(4, maxChars - l.name.length - 8)))}</tspan></text>`;
        const tail = nf ? ` · ${nf} failed` : nr ? ` · ${nr} running` : "";
        body += `<text x="${left - 10}" y="${cy + 4}" font-size="11" text-anchor="end" fill="${nf ? css("--critical-ink") : css("--muted")}" font-variant-numeric="tabular-nums">${n}${tail}</text>`;
        // the whole step as one lane: its span, then every load as a thin mark
        body += `<rect x="${x(lo)}" y="${cy - 6}" width="${Math.max(3, x(hi) - x(lo))}" height="12" rx="3" fill="${css("--surface")}" stroke="${css("--border-strong")}"/>`;
        l.rows.forEach((r) => { body += `<rect x="${x(r.s)}" y="${cy - 4}" width="${Math.max(1.5, x(r.e) - x(r.s))}" height="8" rx="1.5" fill="${color(r)}" opacity="${r.status_id === 2 ? .55 : .95}"/>`; });
        body += `<rect x="0" y="${y}" width="${width}" height="${laneH}" fill="transparent"/></g>`;
        hits.push({ lane: l, y, h: laneH, lo, hi });
        y += laneH + 4;
      }
      if (open) {
        l.rows.sort((a, b) => a.s - b.s).forEach((r) => {
          const i = spans.indexOf(r);
          const full = r.entity || r.pipeline_name || "";
          body += `<text x="${left - 10}" y="${y + rowH - 3}" fill="${css("--ink-2")}" font-size="11" text-anchor="end">${esc(clip(full, maxChars))}</text>`;
          body += `<a href="#/loads/${r.env}/${r.load_id}"><rect data-i="${i}" x="${x(r.s)}" y="${y}" width="${Math.max(3, x(r.e) - x(r.s))}" height="${rowH}" rx="3" fill="${color(r)}"/>` +
                  `<rect data-i="${i}" x="0" y="${y - 1}" width="${width}" height="${rowH + gap}" fill="transparent"/></a>`;
          y += rowH + gap;
        });
        if (grouped) y += 6;
      }
    });
    const height = y + 8;
    const tick = maxX > 240 ? 60 : maxX > 90 ? 30 : maxX > 30 ? 10 : 5;
    let svg = `<svg width="${width}" height="${height}" role="img" aria-label="Load timeline${grouped ? " by step of the flow" : ""}">`;
    for (let m = 0; m <= maxX; m += tick) {
      svg += `<line x1="${x(m)}" x2="${x(m)}" y1="${top - 6}" y2="${height}" stroke="${css("--grid")}" stroke-width="1"/>`;
      svg += `<text x="${x(m)}" y="12" fill="${css("--muted")}" font-size="10" text-anchor="middle">+${m}m</text>`;
    }
    svg += body;
    if (live) svg += `<line x1="${x(nowM)}" x2="${x(nowM)}" y1="${top - 8}" y2="${height}" stroke="${css("--accent")}" stroke-width="1.5" stroke-dasharray="4 3"/>` +
                     `<text x="${x(nowM)}" y="12" fill="${css("--accent-ink")}" font-size="10" font-weight="600" text-anchor="middle">now</text>`;
    svg += "</svg>";
    el.innerHTML = svg;
    el.querySelectorAll("rect[data-i]").forEach((rect) => {
      rect.addEventListener("mousemove", (ev) => { const r = spans[rect.dataset.i];
        showTip(`<b>${esc(r.entity || r.pipeline_name)}</b>${esc(r.pipeline_name)}${r.stage ? " · " + esc(r.stage) : ""}<br>` +
          `<span class="status s-${r.status_id === 3 ? "critical" : r.status_id === 1 ? "running" : r.status_id === 2 ? "good" : "neutral"}">${esc(r.status)}</span> · ${fmtDur(r.duration)}<br>` +
          `${fmtTime(r.start_time)} → ${r.end_time ? fmtTime(r.end_time) : "running"}`, ev); });
      rect.addEventListener("mouseleave", hideTip);
    });
    el.querySelectorAll(".g-lane").forEach((g, gi) => {
      const toggle = () => { const k = g.dataset.lane; el._open.has(k) ? el._open.delete(k) : el._open.add(k); hideTip(); drawGantt(el, rows, t0, opts); };
      g.addEventListener("click", toggle);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
      g.addEventListener("mousemove", (ev) => { const h = hits[gi], L = h.lane, c = (s) => L.rows.filter((r) => r.status_id === s).length;
        showTip(`<b>${esc(L.name)}</b>${esc(L.what)}<br>${L.rows.length} loads · ${c(2)} ok${c(3) ? " · " + c(3) + " failed" : ""}${c(1) ? " · " + c(1) + " running" : ""}<br>` +
          `+${Math.round(h.lo)}m → +${Math.round(h.hi)}m · ${fmtDur(Math.round((h.hi - h.lo) * 60))}<br><span class="muted">Click to ${el._open.has(String(L.key)) ? "close" : "open"}</span>`, ev); });
      g.addEventListener("mouseleave", hideTip);
    });
  };

  // live status in header
  // Status poll: updates the sidebar sync line and, when the collector has new data, refreshes the page in place.
  let seenCycle = null, pollTimer = null, manual = null;   // manual = {saw, since} while a sidebar refresh is pending
  async function poll() {
    const s = window.demoStatus();   // demo: local state instead of /api/status
    document.getElementById("sync-refresh")?.classList.toggle("spinning", !!s.collecting);
    const el = document.getElementById("sync"), dot = document.getElementById("live-dot");
    const live = s.mode === "live", paused = !s.auto, envs = Object.keys(s.active || {});
    if (el) {
      const main = s.collecting ? "Collecting…" : paused ? "Auto refresh off"
        : live ? `Live · ${envs.join(", ")} batch running` : "Auto refresh on";
      const sub = s.last_cycle && !s.collecting ? "Synced " + fmtTime(s.last_cycle) : "";
      el.innerHTML = `<span class="sync-main">${main}</span>` + (sub ? `<span class="sync-sub">${sub}</span>` : "");
      el.title = main + (sub ? " · " + sub : "");
    }
    if (dot) {
      const age = s.last_cycle ? (Date.now() - parseUtc(s.last_cycle).getTime()) / 60000 : Infinity;
      dot.classList.toggle("busy", !!s.collecting);
      dot.classList.toggle("off", paused && !s.collecting);
      dot.classList.toggle("stale", !s.collecting && !paused && age > 30);
      dot.title = s.collecting ? "Collecting now" : paused ? "Auto refresh is off · turn it on in Sources"
        : live ? `Batch running in ${envs.join(", ")} · refreshing every ${s.live_seconds} s (demo)` : "Live · last sync " + Math.round(age) + " min ago";
    }
    document.body.classList.toggle("mode-live", live);
    schedulePoll(30000);
  }
  window.demoPoll = poll;
  function schedulePoll(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }
  // Refresh button beside the sync line: the same "Collect now" as the Sources page (a click, never automatic)
  window.manualRefresh = function () { window.demoCollect({ from: "sidebar" }); };
  // Environments dropdown remembers whether you left it open; a short sidebar scrolls the current page into view
  window.sidebarInit = () => {
    const cur = document.querySelector(".sb-nav .nav a.on"), nav = cur?.closest(".sb-nav");
    if (cur && nav && (cur.offsetTop + cur.offsetHeight > nav.scrollTop + nav.clientHeight)) nav.scrollTop = cur.offsetTop - nav.clientHeight / 2;
    const d = document.getElementById("env-drop");
    if (!d) return;
    try { if (localStorage.getItem("pipelineiq-envs") === "open") d.open = true; } catch (e) {}
    d.addEventListener("toggle", () => { try { localStorage.setItem("pipelineiq-envs", d.open ? "open" : "closed"); } catch (e) {} });
  };
  function autoRefreshable() {
    if (document.hidden || !document.querySelector("[data-live-region]")) return false;
    const a = document.activeElement;
    return !(a && a.matches && a.matches("input[type=search], input[type=text], input[type=date], textarea, select"));
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { document.getElementById("app")?.classList.remove("nav-open"); document.getElementById("client-picker")?.removeAttribute("open"); } });
  document.addEventListener("click", (e) => { const p = document.getElementById("client-picker"); if (p && p.open && !p.contains(e.target)) p.removeAttribute("open"); });
  addEventListener("resize", () => { if (innerWidth > 820) document.getElementById("app")?.classList.remove("nav-open"); });

  // ---------------------------------------------------------------- live filters
  // Forms marked data-live apply as you type/click: fetch the new page, swap [data-live-region] blocks, keep focus.
  function formUrl(form) {
    const fd = new FormData(form), p = new URLSearchParams(), range = fd.get("range");
    for (const [k, v] of fd) {
      if (v === "") continue;
      if ((k === "from" || k === "to") && range && range !== "custom") continue;
      p.append(k, v);
    }
    const qs = p.toString();
    return window.demoPath() + (qs ? "?" + qs : "");
  }
  let inflight;
  async function liveNavigate(url) {
    document.body.classList.add("is-loading");
    try { window.demoLive(url); } finally { setTimeout(() => document.body.classList.remove("is-loading"), 120); }
  }
  window.liveNavigate = liveNavigate;
  const isoDay = (d) => d.toISOString().slice(0, 10);
  function bindLiveForm(form) {
    let timer;
    const go = () => liveNavigate(formUrl(form));
    form.addEventListener("input", (e) => {
      if (e.target.matches("input[type=search], input[type=text]")) { clearTimeout(timer); timer = setTimeout(go, 250); }
    });
    form.addEventListener("change", (e) => {
      const el = e.target;
      if (el.matches("input[type=search], input[type=text]")) return;
      if (el.name === "range") {
        const from = form.querySelector("input[name=from]"), to = form.querySelector("input[name=to]");
        if (el.value === "custom") {            // prefill a sensible custom window, then apply
          if (from && !from.value) from.value = isoDay(new Date(Date.now() - 7 * 864e5));
          if (to && !to.value) to.value = isoDay(new Date());
        } else { if (from) from.value = ""; if (to) to.value = ""; }
      }
      if (el.type === "date") { const c = form.querySelector("input[name=range][value=custom]"); if (c) c.checked = true; }
      go();
    });
    form.addEventListener("submit", (e) => { e.preventDefault(); clearTimeout(timer); go(); });
  }

  // Section chips (About page): highlight the chip for the section in view, or the one just clicked
  function sectionSpy(nav) {
    const links = [...nav.querySelectorAll('a[href^="#"]')];
    const targets = links.map((a) => document.getElementById(a.getAttribute("href").slice(1)));
    let clicked = null, ticking = false;
    const mark = (i) => {
      links.forEach((a, j) => { a.classList.toggle("on", j === i); a.toggleAttribute("aria-current", j === i); });
      const a = links[i];
      if (a) {  // keep the active chip visible in the scrolling chip row, without moving the page
        const l = a.offsetLeft - nav.offsetLeft, r = l + a.offsetWidth;
        if (l < nav.scrollLeft || r > nav.scrollLeft + nav.clientWidth) nav.scrollTo({ left: l - 16, behavior: "smooth" });
      }
    };
    const update = () => {
      ticking = false;
      if (clicked !== null) return;
      const line = nav.getBoundingClientRect().bottom + 48;
      let i = -1;
      targets.forEach((t, j) => { if (t && t.getBoundingClientRect().top <= line) i = j; });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) i = targets.length - 1;
      mark(i);
    };
    links.forEach((a, i) => a.addEventListener("click", () => {
      mark(i); clicked = i;  // hold the clicked chip until the smooth scroll settles
      clearTimeout(a._t); a._t = setTimeout(() => { clicked = null; }, 900);
    }));
    if (window._spy) window.removeEventListener("scroll", window._spy);
    window._spy = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
    window.addEventListener("scroll", window._spy, { passive: true });
    update();
  }

  window.autoRefreshable = autoRefreshable;
  window.bindLiveForm = bindLiveForm;
  window.afterRender = () => {
    document.querySelectorAll("[data-section-spy]").forEach(sectionSpy);
    localiseTimes();
    document.querySelectorAll("form[data-live]").forEach((f) => { if (!f._bound) { f._bound = true; bindLiveForm(f); } });
  };
  document.addEventListener("DOMContentLoaded", () => poll());
})();

// ---- app.js
// PipelineIQ demo: router, page shell (base.html), and the demo engine standing in for the server:
// collecting, auto refresh, alert actions, connection tests and the "Hide client name" switch.
(function () {
  "use strict";
  const D = window.DB, K = window.K;
  const ROUTES = [];
  window.route = (re, fn) => ROUTES.push([re, fn]);
  window.go = (url) => { location.hash = "#" + url; };

  const SECTIONS = [
    ["Monitor", [["/", "Overview", "overview"], ["/alerts", "Alerts", "alerts"], ["/failures", "Error history", "errors"]]],
    ["Pipelines", [["/batches", "Batches", "batches"], ["/entities", "Entities", "entities"], ["/queue", "Process queue", "queue"]]],
    ["Data", [["/systems", "Source systems", "server"], ["/synapse", "Synapse warehouse", "synapse"], ["/deployments", "Deployments", "deployments"]]],
    ["System", [["/sources", "Sources", "sources"], ["/roadmap", "Coming soon", "rocket"]]],
  ];
  const HEALTH_LABEL = { good: "Healthy", warning: "Degraded", critical: "Failing" };
  const HEALTH_WHY = {
    good: "Healthy: no open high- or medium-severity alerts.",
    warning: "Degraded: at least one open medium-severity alert (for example overdue entities or a custom check), and no high-severity ones.",
    critical: "Failing: at least one open high-severity alert (an unrecovered failure, a stuck load, or a source that can't be read).",
  };
  window.HEALTH = { label: HEALTH_LABEL, why: HEALTH_WHY };

  // ---------------------------------------------------------------- demo state
  const S = window.DEMO = { collecting: false, auto: false, mask: false, tests: {}, timer: null, toldCollect: false };
  try { S.mask = localStorage.getItem("pipelineiq-demo-mask") === "on"; } catch (e) {}
  window.demoStatus = () => {
    const live = S.auto && Object.keys(D.active).length > 0;
    return { collecting: S.collecting, last_cycle: D.lastCycle, mode: live ? "live" : "normal", auto: S.auto,
      active: S.auto ? D.active : {}, poll_minutes: 1, live_seconds: 15 };
  };
  window.clientName = () => (S.mask ? D.cfg.alias : D.cfg.client);
  window.envHealth = () => {
    const out = {};
    for (const e of D.envs) {
      const sev = new Set(D.alerts.filter((a) => a.env === e && a.status === "open").map((a) => a.severity));
      out[e] = sev.has("high") ? "critical" : sev.has("medium") ? "warning" : "good";
    }
    return out;
  };
  window.openCounts = () => { const c = {}; for (const a of D.alerts) if (a.status === "open") c[a.severity] = (c[a.severity] || 0) + 1; return c; };

  // ---------------------------------------------------------------- shell
  let cur = { path: "/", query: {}, page: null };
  window.demoPath = () => cur.path;
  const parseHash = () => {
    let h = (location.hash.slice(1) || "/").split("#")[0];
    if (!h.startsWith("/")) h = "/";
    const i = h.indexOf("?"), p = i < 0 ? h : h.slice(0, i), q = i < 0 ? "" : h.slice(i + 1);
    return { path: p, qs: q, query: Object.fromEntries(new URLSearchParams(q)) };
  };
  function resolve(path, query) {
    for (const [re, fn] of ROUTES) { const m = path.match(re); if (m) return fn(query, ...m.slice(1).map(decodeURIComponent)); }
    return { title: "Not found", content: `<section class="card"><div class="empty">This page doesn't exist in the demo. <a class="link" href="/">Back to the Overview</a></div></section>` };
  }
  // every link in the portal is a path ("/failures?env=DEV"); in this single file they become hash routes
  const mask = (h) => (S.mask ? h.replace(/Aldermoor Thermal Group/g, D.cfg.alias).replace(/Aldermoor Thermal/g, D.cfg.alias).replace(/Aldermoor/g, D.cfg.alias.split(" ")[0]) : h);
  const fix = (h) => mask(h.replace(/href="\/(?!\/)/g, 'href="#/'));
  window.fixHtml = fix;

  function here(path) {
    let sec = "About", ic = "info";
    for (const [label, items] of SECTIONS) for (const [href, , icn] of items) if (path === href || (href !== "/" && path.startsWith(href))) { sec = label; ic = icn; }
    return { sec, ic };
  }
  function sidebar(path) {
    const client = window.clientName(), initials = client.split(" ").slice(0, 2).map((w) => w[0]).join("");
    const h = here(path), oc = window.openCounts(), eh = window.envHealth();
    const nf = D.envs.filter((e) => eh[e] === "critical").length, nd = D.envs.filter((e) => eh[e] === "warning").length;
    const worst = nf ? "critical" : nd ? "warning" : "good";
    const nav = SECTIONS.map(([label, items]) => `<div class="nav-section ${h.sec === label ? "on" : ""}"><div class="nav-label">${label}</div><nav class="nav">` +
      items.map(([href, text, ic]) => { const on = path === href || (href !== "/" && path.startsWith(href));

    }
    const roots = D.failures.filter((f) => f.is_root);
    const inWin = roots.filter((f) => f.occurred_at >= tw.since && f.occurred_at <= until);
    const inLo = roots.filter((f) => f.occurred_at >= lo && f.occurred_at <= until);
    const failSeries = Object.fromEntries(envs.map((e) => [e, zeros()]));
    for (const f of inLo) { const i = bk(f.occurred_at); if (i != null) failSeries[f.env][i]++; }
    const batchSeries = Object.fromEntries(envs.map((e) => [e, M.batches(e).filter((b) => b.pipeline_name === D.cfg.batch && b.start_time >= lo && b.start_time <= until && b.duration != null)
      .map((b) => ({ x: b.start_time, y: Math.round(b.duration / 6) / 10, s: b.status }))]));
    const sigGroups = (list) => [...K.groupBy(list, (f) => f.signature)].map(([sig, fs]) => ({ signature: sig, summary: fs.map((f) => f.summary).sort().pop(), n: fs.length,
      envs: K.unique(fs.map((f) => f.env)).join(","), entities: K.unique(fs.map((f) => f.entity || f.pipeline)).length, last_seen: fs[0].occurred_at,
      first_seen: fs[fs.length - 1].occurred_at })).sort((a, b) => b.n - a.n);
    const topErrors = sigGroups(inWin).slice(0, 8), recent = inWin.slice(0, 8);
    const openC = window.openCounts();
    const kpi = { ok, failed, alerts: Object.values(openC).reduce((a, b) => a + b, 0), root_failures: inWin.length, signatures: new Set(inWin.map((f) => f.signature)).size };
    kpi.success_rate = ok + failed ? (100 * ok / (ok + failed)).toFixed(1) : null;
    const maxErr = Math.max(1, ...topErrors.map((g) => g.n));
    const short = K.SHORT[tw.key];

    // change vs the previous period
    const deltas = (() => {
      const since = tw.since !== K.MIN_TS ? K.P(tw.since) : null, untilMs = tw.until !== K.MAX_TS ? Math.min(now, K.P(tw.until)) : now;
      if (since == null || !coverage) return { note: "No earlier period to compare with all history", items: {} };
      const span = untilMs - since, pSince = since - span, first = K.P(coverage);
      if (first > pSince + span * 0.1) return { note: `No earlier ${short} collected to compare with`, items: {} };
      const measure = (a, b) => { const A = K.T(a), B = K.T(b); let o = 0, f = 0;
        for (const l of D.loads) if (l.start_time >= A && l.start_time < B) { if (l.status_id === 2) o++; else if (l.status_id === 3) f++; }
        const r = roots.filter((x) => x.occurred_at >= A && x.occurred_at < B);
        return { failed: f, root_failures: r.length, signatures: new Set(r.map((x) => x.signature)).size, success_rate: o + f ? Math.round(1000 * o / (o + f)) / 10 : null }; };
      const cur = measure(since, untilMs + 1000), prev = measure(pSince, since), items = {};
      for (const [key, worseUp] of [["failed", true], ["root_failures", true], ["signatures", true], ["success_rate", false]]) {
        const c = cur[key], p = prev[key]; if (c == null || p == null) continue;
        let d, text;
        if (key === "success_rate") { d = Math.round((c - p) * 10) / 10; text = d === 0 ? "no change" : `${d > 0 ? "▲" : "▼"} ${Math.abs(d)} pts`; }
        else if (p === 0) { d = c; text = c === 0 ? "no change" : "new"; }
        else { d = Math.round(100 * (c - p) / p); text = d === 0 ? "no change" : `${d > 0 ? "▲" : "▼"} ${Math.abs(d)}%`; }
        items[key] = { text, tone: d === 0 ? "flat" : (d > 0) === worseUp ? "bad" : "good", title: `Previous ${short}: ${num(p)}${key === "success_rate" ? "%" : ""}` };
      }
      return { note: `vs previous ${short}` + (first > pSince ? " (partly collected)" : ""), items };
    })();
    const delta = (key) => { const d = deltas.items[key]; if (!d) return "";
      const arrow = "▲▼".includes(d.text[0]) ? d.text[0] : "";
      return `<span class="ov-delta" title="${esc(d.title)}">${arrow ? `<i class="delta-${d.tone}">${arrow}</i>${esc(d.text.slice(1))}` : esc(d.text)} <span>${esc(deltas.note)}</span></span>`; };

    // releases: chart markers, and the release before each incident
    const deps = D.deployments.filter((d) => d.start_time >= K.T(K.P(lo) - 3 * DAY) && d.start_time <= until);
    const releases = M.group(M.classify(deps));
    const markers = releases.filter((r) => r.start_time >= lo).map((r) => ({ t: r.start_time, env: r.env, branch: r.branch, result: r.result, color: `--series-${envs.indexOf(r.env) + 1}` }));

    // biggest incidents
    const incidents = (() => {
      const o = D.cfg.overview, days = {};
      for (const f of roots) { const d = f.occurred_at.slice(0, 10); days[d] = (days[d] || 0) + 1; }
      const keys = Object.keys(days).sort();
      if (!keys.length) return { items: [], normal: 0, limit: o.incident_min_failures };
      const every = []; for (let t = Date.parse(keys[0] + "T00:00:00Z"); t <= now; t += DAY) every.push(days[new Date(t).toISOString().slice(0, 10)] || 0);
      const normal = K.median(every), limit = Math.max(o.incident_factor * Math.max(normal, 1), o.incident_min_failures);
      const flagged = keys.filter((d) => days[d] >= limit && lo.slice(0, 10) <= d && d <= until.slice(0, 10));
      const groups = [];
      for (const d of flagged) { const g = groups[groups.length - 1]; if (g && (Date.parse(d) - Date.parse(g[g.length - 1])) === DAY) g.push(d); else groups.push([d]); }
      const out = groups.map((g) => {
        const a = `${g[0]} 00:00:00`, b = `${g[g.length - 1]} 23:59:59`, fs = roots.filter((f) => f.occurred_at >= a && f.occurred_at <= b);
        const top = sigGroups(fs)[0], envsI = K.unique(fs.map((f) => f.env)).sort();
        const byEnt = [...K.groupBy(fs, (f) => f.entity || f.pipeline)].sort((x, y) => y[1].length - x[1].length);
        const cut = K.T(K.P(a) - 3 * DAY), before = releases.filter((r) => envsI.includes(r.env) && cut <= r.start_time && r.start_time <= b);
        const peak = Math.max(...g.map((d) => days[d]));
        return { from: g[0], to: g[g.length - 1], days: g.length, n: fs.length, envs: envsI, entities: byEnt.length, names: byEnt.slice(0, 3).map((x) => x[0]),
          top, peak, times: Math.round(peak / Math.max(normal, 1)), release: before.sort((x, y) => (x.start_time < y.start_time ? 1 : -1))[0] || null };
      }).sort((x, y) => y.n - x.n);
      return { items: out.slice(0, 5), more: Math.max(0, out.length - 5), normal, limit };
    })();

    // failures by stage, top failing entities, alert activity
    const stageNames = D.cfg.flow_stages, grid = Object.fromEntries(stageNames.map((s) => [s, zeros()]));
    for (const f of inLo) { const i = bk(f.occurred_at); if (i != null) grid[M.flowStage(f.stage, f.pipeline)][i]++; }
    const stages = { keys: tl.keys, grain: tl.grain, rows: stageNames.map((s) => ({ stage: s, cells: grid[s], total: grid[s].reduce((a, b) => a + b, 0) })) };
    stages.max = Math.max(0, ...stages.rows.flatMap((r) => r.cells));
    const topEnts = [...K.groupBy(inLo, (f) => f.entity || f.pipeline)].sort((a, b) => b[1].length - a[1].length).slice(0, 5).map(([e, fs]) => {
      const series = zeros(); for (const f of fs) { const i = bk(f.occurred_at); if (i != null) series[i]++; }
      return { e, is_entity: fs.some((f) => f.entity), n: fs.length, envs: K.unique(fs.map((f) => f.env)).sort(), last_seen: fs[0].occurred_at, series, error: sigGroups(fs)[0].summary };
    });
    const fired = zeros(), auto = zeros();
    for (const a of D.alerts) {
      if (a.first_seen >= lo && a.first_seen <= until) { const i = bk(a.first_seen); if (i != null) fired[i]++; }
      if (a.status === "resolved" && a.note !== "resolved manually" && a.resolved_at && a.resolved_at >= lo && a.resolved_at <= until) { const i = bk(a.resolved_at); if (i != null) auto[i]++; }
    }
    const A = { keys: tl.keys, grain: tl.grain, first: D.alerts[0]?.first_seen, total_fired: fired.reduce((a, b) => a + b, 0), total_auto: auto.reduce((a, b) => a + b, 0),
      series: [{ label: "Fired", data: fired, color: "--series-3" }, { label: "Auto-resolved", data: auto, color: "--series-4" }] };
    const chart = { keys: tl.keys, grain: tl.grain, since: lo, until: until < K.T(now) ? until : K.T(now),
      fail: { keys: tl.keys, grain: tl.grain, series: envs.map((e, i) => ({ label: e, data: failSeries[e], color: `--series-${i + 1}` })) },
      loads: loadsBy, batch: batchSeries, envs, markers, finish: F, alerts: A };

    const card = (c) => {
      const fs = F.status.find((s) => s.env === c.env), bad = c.sources.filter((s) => !s.ok);
      let meter = "";
      if (c.batch) {
        const okN = c.counts.Successful || 0, badN = c.counts.Failed || 0, run = c.counts["In Progress"] || 0;
        const other = Object.values(c.counts).reduce((a, b) => a + b, 0) - okN - badN - run, tot = Math.max(okN + badN + run + other, 1);
        meter = `<div class="meter ov-meter" role="img" aria-label="Latest batch: ${okN} successful, ${badN} failed, ${run} running" title="${okN} ok · ${badN} failed · ${run} running${other ? " · " + other + " other" : ""}">` +
          (okN ? `<i class="m-good" style="width: ${100 * okN / tot}%"></i>` : "") + (badN ? `<i class="m-bad" style="width: ${100 * badN / tot}%"></i>` : "") +
          (run ? `<i class="m-run" style="width: ${100 * run / tot}%"></i>` : "") + (other ? `<i class="m-other" style="width: ${100 * other / tot}%"></i>` : "") + `</div>`;
      }
      const al = ["high", "medium", "low"].filter((s) => c.alerts[s]).map((s) => `${c.alerts[s]} ${s}`);
      return `<section class="card ov-env">
    <div class="ov-env-head"><a class="env-name" href="/alerts?env=${c.env}"><span class="dot" style="background: ${K.envColor(c.env)}"></span>${c.env}</a>
      <a class="pill pill-${c.health}" href="/alerts?env=${c.env}" title="${window.HEALTH.why[c.health]}">${window.HEALTH.label[c.health]}</a></div>
    ${meter}
    <dl class="ov-facts">
      <dt>Last batch</dt><dd>${c.batch ? `<a href="/batches/${c.env}/${c.batch.load_id}">${K.status(c.batch.status)}</a> <span class="muted">${K.ts(c.batch.start_time)} · ${c.batch.duration ? K.dur(c.batch.duration) : "running"}</span>` : '<span class="muted">None yet</span>'}</dd>
      <dt>On time</dt><dd>${fs && fs.running && fs.eta ? `Running · expected ≈ ${fs.eta.clock}` : fs && fs.runs ? `${fs.met} of ${fs.runs} nights <span class="muted">by ${F.target}</span>` : '<span class="muted">No scheduled runs in this window</span>'}</dd>
      <dt>Alerts</dt><dd><a href="/alerts?env=${c.env}">${al.length ? al.join(" · ") : "None open"}</a></dd>
      <dt>Sources</dt><dd>${bad.length ? `<a class="ov-warn" href="/sources" title="${esc(bad.map((s) => s.message).join(" · "))}">${bad.length} not reading <span class="muted">(${bad.map((s) => s.source.replace("_db", "")).join(", ")})</span></a>` : "<span>All reading</span>"}</dd>
    </dl></section>`;
    };
    const incWhen = (i) => (i.from === i.to ? K.fmtday(i.from) : `${K.fmtday(i.from)} – ${K.fmtday(i.to)}`);
    const content = `<div id="results" data-live-region>
<div class="ov-label"><span>Right now</span></div>
<div class="grid ov-now">
  ${cards.map(card).join("")}
  <section class="card ov-fresh">
    <div class="ov-env-head"><span class="ov-card-t">Freshness</span><a class="card-link" href="/entities?stale=1">Entities ${K.icon("arrow")}</a></div>
    <table class="ov-ftable">
      <tr><th></th>${fresh.map((f) => `<th class="num"><span class="dot" style="background: ${K.envColor(f.env)}"></span>${f.env}</th>`).join("")}</tr>
      <tr title="No success for longer than their usual cadence"><td>Overdue entities</td>${fresh.map((f) => `<td class="num"><a href="/entities?stale=1&env=${f.env}" class="${f.overdue ? "ov-warn" : ""}">${num(f.overdue)}</a></td>`).join("")}</tr>
      <tr title="Watermarks started or completed but not yet finalised"><td>Open watermarks</td>${fresh.map((f) => `<td class="num"><a href="/systems" class="${f.open_wm ? "ov-warn" : ""}">${num(f.open_wm)}</a></td>`).join("")}</tr>
      <tr title="Views and external tables rebuilt in the last 24 hours"><td>Synapse rebuilt · 24h</td>${fresh.map((f) => `<td class="num"><a href="/synapse">${num(f.rebuilt)}</a></td>`).join("")}</tr>
    </table>
  </section>
</div>

<div class="ov-label"><span>${esc(tw.label)}</span>${K.windowNote(tw, coverage, "history")}</div>
<div class="grid cols-4">
  <div class="card kpi"><div class="kpi-label">Load success</div><div class="kpi-value">${kpi.success_rate ?? "—"}<small>%</small></div>${delta("success_rate")}<div class="kpi-spark" data-spark="ok"></div></div>
  <div class="card kpi"><div class="kpi-label">Failed loads</div><div class="kpi-value">${num(kpi.failed)}</div>${delta("failed")}<div class="kpi-spark" data-spark="failed"></div></div>
  <div class="card kpi"><div class="kpi-label">Root causes</div><div class="kpi-value">${num(kpi.root_failures)}</div>${delta("root_failures")}<div class="kpi-foot">${kpi.signatures} distinct error${kpi.signatures === 1 ? "" : "s"}</div></div>
  <a class="card kpi" href="/alerts"><div class="kpi-label">Open alerts</div><div class="kpi-value">${kpi.alerts}</div>
    <div class="kpi-foot ov-sev">${["high", "medium", "low"].map((s) => `<span class="${openC[s] ? "on-" + s : ""}"><b>${openC[s] || 0}</b> ${s}</span>`).join("")}</div></a>
</div>

<div class="grid cols-main section">
  <section class="card fill">
    ${K.cardHead("Root-cause failures", `Per ${tl.grain} · click a bar to open them`, "/failures?" + K.twqs(tw), "Error history")}
    <div class="card-body"><div class="chart-box"><canvas id="failChart" aria-label="Root-cause failures per ${tl.grain}, with releases marked"></canvas></div>
      ${markers.length ? '<div class="legend ov-legend"><span><i class="mark-key"></i>Release</span></div>' : ""}</div>
  </section>
  <section class="card ov-inc">
    ${K.cardHead("Biggest incidents", "Days far above normal")}
    ${incidents.items.length ? `<div class="ov-inc-list">${incidents.items.map((i) => `<a class="ov-inc-row" href="/failures?range=custom&from=${i.from}&to=${i.to}" title="${esc(i.top?.summary || "")}">
        <span class="ov-inc-when">${incWhen(i)}<small>${i.envs.join(" · ")}${i.release ? " · after a release" : ""}</small></span>
        <span class="ov-inc-n">${num(i.n)}<small>${i.times}×</small></span></a>`).join("")}</div>` : K.empty("Nothing unusual in this window.")}
  </section>
</div>

<details class="ov-more" id="ov-more">
  <summary><span class="ov-more-t">More detail</span><span class="ov-more-sub">Incidents and their releases · failures by stage · top entities · ${D.cfg.batch} timing · recurring errors · alert activity · latest failures</span>
    <svg class="ov-more-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg></summary>
<div class="ov-more-body">
<section class="card section">
  ${K.cardHead("Biggest incidents", `Days with at least ${Math.round(incidents.limit)} root-cause failures: ${D.cfg.overview.incident_factor}× a normal day (${(Math.round(incidents.normal * 10) / 10)}) · consecutive days merged · ${esc(tw.label)}`)}
  ${incidents.items.length ? `<div class="incidents">${incidents.items.map((i) => `<a class="incident" href="/failures?range=custom&from=${i.from}&to=${i.to}">
      <div class="inc-when"><b>${incWhen(i)}</b><span>${i.days} day${i.days === 1 ? "" : "s"}${i.envs.map((e) => " " + K.envTag(e)).join("")}</span></div>
      <div class="inc-n"><b>${num(i.n)}</b><span>failures · peak ${i.peak}/day, ${i.times}× normal</span></div>
      <div class="inc-what"><div class="clip primary">${esc(i.top?.summary || "(no message)")}</div>
        <div class="secondary"><span class="clip">${i.top.n} of ${i.n} share this error · ${i.entities} entit${i.entities === 1 ? "y" : "ies"}: ${esc(i.names.join(", "))}${i.entities > i.names.length ? " …" : ""}</span></div>
        ${i.release ? `<div class="inc-release">${K.icon("deployments")} <span>Release into ${i.release.env} on ${K.ts(i.release.start_time)}</span> <span class="mono">${esc(i.release.branch.replace("refs/heads/", ""))}</span> ${K.status(i.release.result)}</div>` : ""}</div>
      <span class="card-link">Open ${K.icon("arrow")}</span></a>`).join("")}</div>
    ${incidents.more ? `<div class="card-body secondary" style="padding-top:0">${incidents.more} smaller incident${incidents.more === 1 ? "" : "s"} not shown.</div>` : ""}`
    : K.empty(`No incidents in this window: no day reached ${Math.round(incidents.limit)} root-cause failures.`)}
</section>

<div class="grid cols-2 section">
  <section class="card">
    ${K.cardHead("Failures by stage", `Root-cause failures per ${tl.grain}, by where in the flow they happened · click a cell to open them`)}
    <div class="card-body">${stages.max ? `<div id="stageGrid" class="heat-wrap"></div><div class="heat-scale"><span>Fewer</span><i></i><span>More (max ${stages.max} per ${tl.grain})</span></div>` : K.empty("No root-cause failures in this window.")}</div>
  </section>
  <section class="card">
    ${K.cardHead("Top failing entities", "Most root-cause failures · " + esc(tw.label), "/failures?" + K.twqs(tw), "Error history")}
    ${topEnts.length ? `<div class="table-wrap"><table><tr><th>Entity</th><th class="hide-sm">Trend</th><th class="num">Failures</th></tr>
      ${topEnts.map((t, i) => `<tr><td class="summary"><a class="primary" href="${t.is_entity ? "/entities/" + encodeURIComponent(t.e) : "/failures?q=" + encodeURIComponent(t.e) + "&" + K.twqs(tw)}">${esc(t.e)}</a>
        <div class="secondary"><span class="clip">${t.envs.map((e) => e + " · ").join("")}${esc(t.error || "")}</span></div></td>
        <td class="hide-sm" style="width:34%"><div class="ent-spark" data-ent-spark="${i}"></div></td>
        <td class="num"><b>${t.n}</b><div class="secondary">last ${K.ago(t.last_seen)}</div></td></tr>`).join("")}</table></div>` : K.empty("No root-cause failures in this window.")}
  </section>
</div>

<div class="grid cols-2 section">
  <section class="card fill">
    ${K.cardHead(D.cfg.batch + " duration", "Minutes per run · ✕ marks a failed batch · " + esc(tw.label), "/batches?" + K.twqs(tw), "Batches")}
    <div class="card-body"><div class="legend" style="margin-bottom:10px">${envs.map((e) => `<span><i style="background: ${K.envColor(e)}"></i>${e}</span>`).join("")}${markers.length ? '<span><i class="mark-key"></i>Release</span>' : ""}</div>
      <div class="chart-box"><canvas id="batchChart" aria-label="Batch duration over time by environment, with releases marked"></canvas></div></div>
  </section>
  <section class="card fill">
    ${K.cardHead(D.cfg.batch + " finish time", `Scheduled runs (manual reruns left out) · ${F.tz_label} · target ${F.target} (set in config.yaml)`)}
    <div class="card-body">
      <div class="legend" style="margin-bottom:10px">${envs.map((e) => `<span><i style="background: ${K.envColor(e)}"></i>${e}</span>`).join("")}<span><i class="mark-key mark-h"></i>Target</span><span><i class="eta-key"></i>Expected finish</span></div>
      <div class="chart-box"><canvas id="finishChart" aria-label="When each scheduled batch finished, against the target"></canvas></div>
      <div class="finish-status">${F.status.map((s) => `<div>${K.envTag(s.env)}
        ${s.runs ? `<span><b>${s.met}</b> of ${s.runs} on target</span>` : ""}
        ${s.running ? (s.eta ? `<span>Running since ${K.ts(s.running.start)} · expected ≈ <b>${s.eta.clock}</b> ${F.tz_label}
            ${s.eta.overdue ? '<span class="status s-warning">Longer than usual</span>' : s.eta.on_track ? '<span class="status s-good">On track</span>' : '<span class="status s-critical">Likely late</span>'}</span>` : `<span>Running since ${K.ts(s.running.start)}</span>`)
          : s.usual_finish ? `<span>Usually finishes ≈ <b>${s.usual_finish}</b> ${F.tz_label}</span>` : ""}</div>`).join("")}</div>
    </div>
  </section>
</div>

<div class="grid cols-2 section">
  <section class="card">
    ${K.cardHead("Top recurring errors", "Grouped by normalised message · " + esc(tw.label), "/failures?" + K.twqs(tw), "Explore")}
    ${topErrors.length ? `<div class="table-wrap"><table><tr><th>Error</th><th class="hide-sm">Env</th><th class="num">Occurrences</th></tr>
      ${topErrors.slice(0, 4).map((g) => `<tr><td class="summary"><a class="clip primary" href="/failures?sig=${g.signature}&${K.twqs(tw)}">${esc(g.summary || "(no message)")}</a>
        <div class="secondary">${g.entities} entit${g.entities === 1 ? "y" : "ies"} · last ${K.ago(g.last_seen)}</div></td>
        <td class="nowrap hide-sm">${g.envs.split(",").map((e) => K.envTag(e)).join(" ")}</td>
        <td class="num"><div class="bar-cell"><span class="bar" style="width: ${Math.round(48 * g.n / maxErr) + 4}px"></span>${g.n}</div></td></tr>`).join("")}</table></div>` : K.empty("No failures in this window.")}
  </section>
  <section class="card fill">
    ${K.cardHead("Alert activity", `${num(A.total_fired)} fired, ${num(A.total_auto)} auto-resolved · per ${tl.grain}`, "/alerts?status=all&" + K.twqs(tw), "Alerts")}
    <div class="card-body">${A.total_fired || A.total_auto ? `<div class="legend" style="margin-bottom:10px">${A.series.map((s) => `<span><i style="background: var(${s.color})"></i>${s.label}</span>`).join("")}</div>
      <div class="chart-box"><canvas id="alertChart" aria-label="Alerts fired and auto-resolved per ${tl.grain}"></canvas></div>` : K.empty("No alert activity in this window.")}</div>
  </section>
</div>

<section class="card section">

  <div class="card ar-def"><span class="src-icon">${K.icon("alerts")}</span><b>Alert</b><p>One problem a rule found, identified by <em>environment + rule + what it's about</em> (an entity, a load, a source, or the whole environment for roll-ups). It <b>fires</b> the first cycle the problem is seen, and stays one alert however many cycles it lasts.</p></div>
  <div class="card ar-def"><span class="src-icon">${K.icon("bell")}</span><b>Notification</b><p>Sent once, when an alert fires, if its severity is <b>${floor}</b> or above (${channels.join(" and ")}). Every alert shows in the portal whatever its severity.</p></div>
</div>
<section class="card section lc">${K.cardHead("How an alert is decided", "Every collection cycle, for each environment")}
  <div class="lc-flow">${flow.map((f, i) => node(...f) + (i < flow.length - 1 ? '<span class="lc-arrow" aria-hidden="true"></span>' : "")).join("")}</div>
  <div class="lc-then"><span class="ab-col-label">Then, on each later cycle</span>
    <div class="grid cols-4">
      <div class="lc-case"><b>Still true</b><p>The same alert is updated: checks +1, title and detail refreshed. No new notification.</p></div>
      <div class="lc-case good"><b>No longer true</b><p>Auto-resolved, with the note "auto-resolved". This is how most alerts close.</p></div>
      <div class="lc-case"><b>Acknowledged</b><p>You've seen it. It stays until the condition clears, then auto-resolves.</p></div>
      <div class="lc-case warn"><b>Resolved by hand, still true</b><p>It fires again next cycle as a new alert, and notifies again if it qualifies.</p></div>
    </div>
    <p class="ab-note">If a rule itself errors in a cycle, its alerts are left as they are rather than auto-resolved.</p></div>
</section>
<div class="grid cols-3 section">
  ${sevCard("high", "Broken now and needs someone: a failure with no recovery, a stuck load, or PipelineIQ can't read a source.", "Failing")}
  ${sevCard("medium", "Late or drifting, and will become a problem: overdue entities, stalled watermarks, a missing batch.", "Degraded")}
  ${sevCard("low", "Housekeeping, worth knowing but not urgent: slow runs, orphan Audit rows, naming issues in the framework.", "No change")}
</div>
<section class="card section">${K.cardHead("The rules", `${rules.length} kinds of alert · ${totals.fired} fired so far, ${totals.notified} notified, ${totals.resolved} resolved`, null, null, '<a class="card-link" href="/alerts?status=all">All alerts →</a>')}
  <div class="table-wrap"><table class="ar-table">
    <tr><th>Rule</th><th>Severity</th><th>Fires when</th><th>Clears when</th><th>Notified</th><th class="num">Open</th><th class="num">Fired</th><th>Last fired</th></tr>
    ${rules.map((r) => `<tr id="rule-${r.id}" class="${r.enabled ? "" : "off"}">
      <td class="nowrap"><a class="primary" href="/alerts?status=all&kind=${r.id}">${r.name}</a><div class="secondary">${r.scope}</div>${r.enabled ? "" : '<span class="tag" title="Set expect_batch_every_hours on an environment in config.yaml">Off</span>'}</td>
      <td class="nowrap">${r.severity === "per check" ? '<span class="ink-2">Per check</span>' : K.sev(r.severity)}</td>
      <td class="ar-text">${r.fires}<div class="secondary">Reads ${r.reads}</div></td><td class="ar-text ink-2">${r.clears}</td>
      <td class="nowrap">${r.notified ? `<span class="ar-yes">${K.icon("bell")}Yes</span>` : '<span class="muted">Portal only</span>'}${r.notified_n ? `<div class="secondary">${r.notified_n} sent</div>` : ""}</td>
      <td class="num">${r.open || r.acknowledged ? `<b>${(r.open || 0) + (r.acknowledged || 0)}</b>${r.envs.map((e) => " " + K.envTag(e)).join("")}` : '<span class="muted">0</span>'}</td>
      <td class="num ink-2">${r.total}</td><td class="nowrap ink-2">${K.ts(r.last_fired)}</td></tr>`).join("")}
  </table></div>
</section>
<div class="grid cols-2 section">
  <section class="card">${K.cardHead("Notification settings", "notify: in config.yaml")}
    <div class="card-body"><dl class="ar-dl">
      <dt>Minimum severity</dt><dd>${K.sev(floor)} <span class="muted">· alerts below this show in the portal only</span></dd>
      <dt>Mac notification</dt><dd>On <span class="muted">· up to 5 per cycle, then a "+N more" summary</span></dd>
      <dt>Teams</dt><dd>Off: no webhook set</dd>
      <dt>When</dt><dd>Once, when the alert fires. Never again for the same open alert.</dd></dl></div>
  </section>
  <section class="card">${K.cardHead("Custom checks", D.cfg.checks.length + " in config.yaml · read-only SQL through the guard")}
    <div class="card-body">${D.cfg.checks.map((k) => `<details class="ar-check"><summary><b>${esc(k.name)}</b> ${K.sev(k.severity || "medium")} <span class="muted">· ${k.db} · ${k.env}</span></summary><pre>${esc(k.sql)}</pre></details>`).join("")}</div>
  </section>
</div>
<section class="card section">${K.cardHead("Recently fired", "Newest first, any state", "/alerts?status=all", "All alerts")}
  <div class="table-wrap"><table><tr><th>Fired</th><th>Severity</th><th>Alert</th><th>Environment</th><th>Rule</th><th>Notified</th><th>State</th></tr>
  ${recent.map((a) => { const kn = kindName(a); return `<tr><td class="nowrap ink-2">${K.ts(a.first_seen)}</td><td>${K.sev(a.severity)}</td>
    <td class="summary"><a class="primary clip" href="${a.link || "#"}">${esc(a.title)}</a></td><td>${K.envTag(a.env)}</td><td><a class="tag" href="#rule-${kn.id}">${kn.name}</a></td>
    <td class="nowrap">${a.notified_at ? `<span class="ar-yes">${K.icon("bell")}${K.ts(a.notified_at)}</span>` : '<span class="muted">—</span>'}</td><td>${K.status(STATE[a.status])}</td></tr>`; }).join("")}</table></div>
</section>`;
    return { title: "Alert rules", crumb: '<a href="/failures">Error history</a> / Alert rules',
      sub: `<p class="page-sub">What each alert rule checks, how severe it is and what it has fired.</p><details class="page-how"><summary>How this page works</summary><p>What each rule checks, how severe it is, what it has fired, and how PipelineIQ decides whether to tell you. Thresholds come from <code>config.yaml</code>, so this page always matches what's running.</p></details>`, content };
  });

  // ================================================================ Failure detail
  route(/^\/failures\/(\w+)\/(.+)$/, (q, env, fid) => {
    const f = D.failById[env + "|" + fid];
    if (!f) return { title: "Failure not found", crumb: '<a href="/failures">Error history</a>', content: `<section class="card"><div class="empty">This failure isn't in the store any more. <a class="link" href="/failures">Back to Error history</a></div></section>` };
    const l = f._l, load = f.load_id ? D.byId[env][f.load_id] : null, ent = D.ents[f.entity];
    const entity = f.entity || f.pipeline, step = f.entity ? f.category : null;
    const parent = load?.parent_load_id ? D.byId[env][load.parent_load_id] : null;
    const adfRun = f.source === "ADF" && load ? { invoked_by_name: parent ? parent.pipeline_name : load.trigger || "Nightly schedule", invoked_by_type: parent ? "PipelineActivity" : load.invoked,
      duration_ms: (load.duration || 0) * 1000 } : null;
    const nb = l?.nb || null;
    const params = f.source === "ADF" && load ? Object.fromEntries(Object.entries({
      entityCode: f.entity || "", curationStage: load.stage || "", sourceSystemCode: ent?.sys || "",
      processScriptPath: nb ? nb.slice(0, nb.lastIndexOf("/") + 1) : "", processScriptName: nb ? nb.slice(nb.lastIndexOf("/") + 1) : "",
      queuedLocation: ent && (f.category === "RAW" || f.category === "BASE") ? `${ent.sys.toLowerCase()}/${ent.tbl.toLowerCase()}/${load.start_time.slice(0, 10).replace(/-/g, "/")}/` : "",
      workQueueId: f.category ? String(7700000 + (f.load_id % 900000)) : "", loadType: ent ? (ent.inc ? "Incremental" : "Full") : "", parentLoadId: String(load.parent_load_id || load.load_id),
    }).filter(([, v]) => v !== undefined)) : {};
    const tp = D.TPL[l?.err], acts = [];
    if (f.source !== "Databricks" && tp?.act) acts.push({ activity_name: tp.act[0], activity_type: tp.act[1], failure_type: "UserError", error_code: tp.act[2], message: f.detail.split("\n").slice(0, tp.nb ? 3 : 6).join("\n") });
    if (l?.cascade) acts.push({ activity_name: f.activity, activity_type: "ExecutePipeline", failure_type: "UserError", error_code: "2011", message: f.detail });
    const children = l?.cascade ? ((l.group || l.kids || []).filter((g) => g.plan === 3 && g.pe <= D.collectedAt)) : [];
    const history = step ? (D.byEntity[f.entity] || []).filter((r) => r.category === step).slice(-40).reverse() : [];
    const same = D.failures.filter((x) => x.signature === f.signature && !(x.env === env && x.fid === fid)).slice(0, 30);
    const dbx = f._dbx ? { notebook_path: f._dbx.notebook_path, error_trace: f._dbx.error_trace } : l?.f?.nbPath ? { notebook_path: l.f.nbPath, error_trace: f.detail } : null;
    const lastDeploy = D.deployments.filter((d) => d.env === env && d.start_time <= f.occurred_at).pop();
    const actions = (f.adf_url ? K.ext("ADF monitor", "Azure Data Factory Studio · run monitor") : "") + (f.dbx_url ? ` <a class="btn primary" href="#" data-ext="the Databricks run page">${K.icon("external")} Databricks run</a>` : "");
    const content = `<div class="callout"><span class="ic">${K.icon("x-circle")}</span><div><div class="t">Root cause</div><div class="m">${esc(f.summary || "No error message captured")}</div></div></div>
<div class="grid cols-main section">
  <section class="card">${K.cardHead("Run context")}
    <div class="card-body"><dl class="kv">
      <dt>Pipeline</dt><dd>${esc(f.pipeline)}</dd>
      ${f.activity ? `<dt>Failed activity</dt><dd>${esc(f.activity)}</dd>` : ""}
      ${params.processScriptName ? `<dt>Notebook</dt><dd class="mono">${esc(params.processScriptPath + params.processScriptName)}</dd>` : ""}
      ${params.queuedLocation ? `<dt>Queued file</dt><dd class="mono">${esc(params.queuedLocation)}</dd>` : ""}
      ${adfRun ? `<dt>Invoked by</dt><dd>${esc(adfRun.invoked_by_name)}</dd><dt>Duration</dt><dd>${K.dur(adfRun.duration_ms / 1000)}</dd>` : ""}
      ${load ? `<dt>Audit load</dt><dd><a class="link" href="/batches/${env}/${load.root_load_id || load.load_id}">#${load.load_id}</a> &nbsp;${K.status(load.status)}${load.parent_load_id ? ` <span class="muted">· parent #${load.parent_load_id}</span>` : ""}</dd>` : ""}
      ${params.workQueueId ? `<dt>Work queue id</dt><dd>${params.workQueueId}</dd>` : ""}
      ${lastDeploy ? `<dt>Last deploy before</dt><dd>${K.ts(lastDeploy.start_time)} <div class="muted mono" style="font-size:11.5px">${esc(lastDeploy.branch)}</div></dd>` : ""}
      ${f.run_id ? `<dt>ADF run id</dt><dd class="mono muted">${f.run_id}</dd>` : ""}
    </dl></div>
  </section>
  <div class="stack">
    <section class="card">${K.cardHead("Run history", `Last ${history.length} runs${step ? ` of the ${K.cap(step)} step` : ""}, oldest to newest`, f.entity ? "/entities/" + encodeURIComponent(entity) + (step ? "?category=" + step : "") : null, "Entity")}
      <div class="card-body">${history.length ? `<div class="strip" aria-label="Recent runs, oldest to newest">${history.slice().reverse().map((h) => `<a href="/loads/${h.env}/${h.load_id}" class="b-${h.status === "Successful" ? "good" : h.status === "Failed" ? "critical" : h.status === "In Progress" ? "running" : "neutral"}" title="${h.env} · ${h.status} · ${h.start_time} UTC · ${K.dur(h.duration)}"></a>`).join("")}</div>
        <div class="meter-legend" style="margin-top:10px"><span><span class="status s-good">Successful</span></span><span><span class="status s-critical">Failed</span></span><span><span class="status s-warning">Running</span></span></div>` : '<p class="muted" style="margin:0">No Audit history for this entity.</p>'}</div>
    </section>
    <section class="card">${K.cardHead("Same error elsewhere", `${same.length} other occurrence${same.length === 1 ? "" : "s"}`)}
      ${same.length ? `<div class="table-wrap" style="max-height:260px;overflow-y:auto"><table>${same.map((s) => `<tr><td><a class="primary" href="/failures/${s.env}/${s.fid}">${esc(s.entity || s.pipeline)}</a></td><td>${K.envTag(s.env)}</td><td class="num ink-2" title="${s.occurred_at} UTC">${K.ago(s.occurred_at)}</td></tr>`).join("")}</table></div>`
        : '<div class="card-body muted">This error signature hasn\'t been seen anywhere else.</div>'}
    </section>
  </div>
</div>
${children.length ? `<section class="card section">${K.cardHead("Failed child runs")}<div class="table-wrap"><table>${children.map((c) => `<tr><td><a class="primary" href="/failures/${env}/adf:${c.pipeline_run_id}">${esc(c.entity_code || c.pipeline_name)}</a></td><td class="ink-2">${esc(c.pipeline_name)}</td><td class="ink-2">${K.ts(K.T(c.ps))}</td></tr>`).join("")}</table></div></section>` : ""}
${acts.length ? `<section class="card section">${K.cardHead("Failed activities", acts.length + " reported by Data Factory")}<div class="card-body stack">${acts.map((a) => `<div><div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap"><b style="font-weight:550">${esc(a.activity_name)}</b><span class="tag">${a.activity_type}</span><span class="tag">${a.failure_type}</span><span class="tag">Code ${a.error_code}</span></div><pre class="err">${esc(a.message)}</pre></div>`).join("")}</div></section>` : ""}
<section class="card section">${K.cardHead("Full error", f.detail.length + " characters")}
  <div class="card-body"><details ${f.detail.length < 4000 ? "open" : ""}><summary>Stack trace</summary><pre class="err">${esc(f.detail)}</pre></details>
  ${dbx && dbx.error_trace ? `<details><summary>Databricks run output · ${esc(dbx.notebook_path || "")}</summary><pre class="err">${esc(dbx.error_trace)}</pre></details>` : ""}</div>
</section>
${Object.keys(params).length ? `<section class="card section">${K.cardHead("Data Factory parameters")}<div class="card-body"><dl class="kv">${Object.entries(params).map(([k, v]) => `<dt>${k}</dt><dd class="mono">${v !== "" ? esc(v) : "—"}</dd>`).join("")}</dl></div></section>` : ""}`;
    return { title: entity, crumb: `<a href="/failures">Error history</a> / ${env}`, heading: esc(entity),
      sub: `<p class="page-sub" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${K.envTag(env)}${f.stage ? `<span class="tag">${esc(f.stage)}</span>` : ""}<span class="tag">${f.source}</span>
        <span>Failed ${K.ts(f.occurred_at)} · ${K.ago(f.occurred_at)}</span>${f.is_root ? "" : '<span class="tag">Cascaded from a child failure</span>'}</p>`, actions, content };
  });
})();

<div class="grid cols-main section">

    return { title: `${schema}.${name}`, crumb: `<a href="/synapse">Synapse warehouse</a> / ${esc(schema)}`, content,

  // ================================================================ Deployments
  const result = (r) => `<span class="status s-${{ Succeeded: "good", Running: "running", "Failed · retried": "critical", "Didn't complete": "critical" }[r] || "neutral"}">${esc(r)}</span>`;

    const tw = K.timeWindow(q, "90d"), env = q.env || "", qq = (q.q || "").toLowerCase(), ef = K.envFilter(env);
