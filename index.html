<!doctype html>
<!--
  ============================================================================
  GUARDRAIL — DO NOT REGENERATE THIS FILE
  ----------------------------------------------------------------------------
  This is the build template for every page on the site. Two build-time
  contracts depend on the markup here:

    1. The SEO_HEAD placeholder marker (in <head>) is replaced by
       scripts/prerender.mjs with route-specific title, meta, canonical,
       OG/Twitter tags, and JSON-LD.

    2. The full prerendered body is written into <body> by the Puppeteer
       snapshot pass in scripts/prerender.mjs (via scripts/snapshot.mjs)
       so crawlers (Googlebot, GPTBot, ClaudeBot, PerplexityBot) can read
       the page prose without executing JavaScript.

  The #root visibility veil + safety-net <script> below hide the prerendered
  body from real users until React mounts (so users see the splash screen,
  not a flash of unstyled prerendered content). The fallback timeout
  guarantees content becomes visible even if the JS bundle fails to load.

  If Lovable / Cursor / any AI assistant proposes "fixing" or "modernizing"
  this file, REJECT the change unless it preserves:
    - the SEO_HEAD placeholder comment
    - the #root visibility veil <style>
    - the safety-net reveal <script>
  Removing any of these silently breaks SEO output OR user UX.

  Pair file: scripts/prerender.mjs (orchestrator)
  Pair file: scripts/seo-config.mjs (per-route metadata source)
  Pair file: scripts/snapshot.mjs (Puppeteer body-capture pass)
  Pair file: src/main.tsx (consumer of data-react-ready attribute)

  Last reviewed: 2026-05-03
  ============================================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="alternate" type="application/rss+xml" title="InclinedPlane Blog" href="/rss.xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF6A00" />
  <style id="prerender-veil">
    /* Veil hides #root only on NON-prerendered pages (i.e. dev mode and
         pre-snapshot intermediate builds), where the body has no
         data-prerendered marker. On prerendered production pages the body
         has data-prerendered="true" (stamped by scripts/prerender.mjs), so
         this selector does NOT match and #root is visible from the moment
         the HTML parses — which is what makes bot screenshots (Google Rich
         Results, LinkedIn, Lighthouse) catch real content instead of a
         blank page or splash mid-animation. */
    body:not([data-prerendered]) #root:not([data-react-ready]) {
      visibility: hidden;
    }
  </style>
  <script>
    // Safety net for the dev-mode veil: if the JS bundle never executes
    // (parse error, network failure), reveal #root after 5s so the
    // page is not stuck invisible. On prerendered production pages the
    // veil never applied in the first place, so this is a no-op there.
    setTimeout(function () {
      var r = document.getElementById("root");
      if (r && !r.hasAttribute("data-react-ready")) r.setAttribute("data-react-ready", "true");
    }, 5000);
  </script>
  <!--SEO_HEAD-->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
