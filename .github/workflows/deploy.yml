# =============================================================================
# GUARDRAIL — DO NOT REGENERATE THIS WORKFLOW
# Last reviewed: 2026-05-03
# -----------------------------------------------------------------------------
# This workflow is the ONLY way the production site gets deployed with full
# body-prerendered HTML. Vercel's own build container cannot run a headless
# browser (missing libnspr4 / libnss3 / libgbm1 system libs, no apt access),
# so we build on a real Ubuntu runner here and push the prebuilt artifact
# to Vercel via the CLI's --prebuilt flag.
#
# REQUIREMENTS for this to run:
#   1. Three repository secrets must exist on this repo:
#        - VERCEL_TOKEN     (account-scoped or project-scoped Vercel token)
#        - VERCEL_ORG_ID    (the Vercel team/org ID, from .vercel/project.json
#                            after running `vercel link` locally, or from the
#                            Vercel dashboard → Account Settings → Your ID)
#        - VERCEL_PROJECT_ID (project ID, from .vercel/project.json or the
#                             project's Settings → General page on Vercel)
#   2. Vercel's git auto-build for this project must be DISABLED (Project
#      Settings → Git → Ignored Build Step → set to `exit 0`, or under Git
#      Connection → Production Branch → toggle off auto-deploy). Otherwise
#      Vercel will race this workflow and serve a half-broken build.
#
# CONTRACT this workflow upholds:
#   - Installs Chromium runtime libs (libnspr4, libnss3, libgbm1, plus the
#     other Playwright deps) via apt — we have sudo here, unlike Vercel.
#   - Runs `npm run build` end-to-end, including PASS 1 (head injection),
#     PASS 2 (Playwright body snapshot of all 28 routes), PASS 3 (sitemap +
#     RSS). Build fails if BODY PASS produces fewer than 28 successful
#     snapshots — see the "Verify body prerender" step.
#   - Hands the prebuilt dist/ to Vercel via `vercel deploy --prebuilt --prod`.
#     Vercel does NOT re-run any build.
#
# If Lovable / Cursor / any AI assistant proposes "simplifying" by removing
# the apt step, the playwright install, or the verify step: REJECT. Each is
# load-bearing for the crawler-visibility contract.
#
# Pair file: scripts/prerender.mjs (the build it drives)
# Pair file: scripts/snapshot.mjs (the Playwright body capture)
# Pair file: vercel.json (Vercel hosting config; Vercel skips its own build)
# =============================================================================

name: Build and deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  # Cancel in-progress runs on the same branch — only the latest commit
  # should ship.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Chromium runtime libraries
        # The exact libs Playwright's bundled Chromium needs at runtime.
        # Vercel's build container cannot do this; this workflow can.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnspr4 libnss3 libgbm1 \
            libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxkbcommon0 libpango-1.0-0 \
            libcairo2 libasound2t64 libdrm2 \
            fonts-liberation

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build (vite + head/body/sitemap/rss prerender)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

      - name: Verify body prerender succeeded for ALL 28 routes
        # Every successful body snapshot writes a <noscript> block alongside
        # the captured DOM. If a route fell back to head-only (Chromium
        # crashed, splash never completed, network hung, etc.) it will be
        # missing that block. Walk every dist/**/index.html and fail the
        # build if any is missing — catches partial body-pass failures that
        # a sampled spot-check would miss.
        run: |
          set -e
          missing=0
          for file in $(find dist -name index.html | sort); do
            if ! grep -q '<noscript>' "$file"; then
              echo "::error::$file is missing <noscript> fallback — body snapshot for this route failed."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing route(s) failed body snapshot. See PRERENDER + SNAPSHOT SUMMARY above."
            exit 1
          fi
          echo "All $(find dist -name index.html | wc -l) prerendered routes have body content."

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=${VERCEL_TOKEN}

      - name: Package prebuilt artifact for Vercel
        # We already built dist/ above. Do NOT re-run `vercel build` (which
        # would re-execute `npm run build` per vercel.json's buildCommand
        # and waste 3+ minutes redoing the entire Playwright snapshot).
        # Instead, hand-construct the .vercel/output/ directory per the
        # Vercel Build Output API spec: static files in static/, plus a
        # config.json carrying our routing rules from vercel.json.
        # https://vercel.com/docs/build-output-api/v3
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "cleanUrls": true,
            "trailingSlash": false,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/((?!api/).*)", "dest": "/index.html" }
            ]
          }
          JSON

      - name: Deploy prebuilt artifact to Vercel
        run: vercel deploy --prebuilt --prod --token=${VERCEL_TOKEN}
