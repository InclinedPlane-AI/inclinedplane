# =============================================================================
# GUARDRAIL — staging + PR preview deploys for the `revamp` branch
# Added: 2026-11-21
# -----------------------------------------------------------------------------
# Same build as production (.github/workflows/deploy.yml): Vite + Playwright
# body prerender on a real Ubuntu runner, then `vercel deploy --prebuilt`.
# Vercel never builds this site itself (see CLAUDE.md).
#
#   push to `revamp`        -> production deploy of the STAGING Vercel project
#                              (stable URL, e.g. inclinedplane-staging.vercel.app)
#   pull_request -> revamp  -> preview deploy of the staging project; the URL is
#                              posted as a PR comment
#
# Every deploy here is served with `X-Robots-Tag: noindex` (via
# scripts/vercel-output.mjs --noindex) so search engines never index staging.
#
# Secrets used (already exist for deploy.yml, nothing new to add):
#   VERCEL_TOKEN    must be ACCOUNT-scoped (not limited to the prod project)
#   VERCEL_ORG_ID   the Vercel account/team that owns production
#
# The staging project (`inclinedplane-staging`) lives in the SAME Vercel
# account as production. The "Link staging project" step links to it by name
# and creates it on first run, from an empty temp dir so Vercel never connects
# it to git (git-triggered Vercel builds can't run our Playwright prerender).
# It then turns off Vercel login protection on previews so the team and the
# founder can open preview links without a Vercel account.
#
# Never use VERCEL_PROJECT_ID here: that is PRODUCTION.
# Fork PRs get no secrets: build + verify run, deploy steps are skipped.
# =============================================================================

name: Build and deploy staging

on:
  push:
    branches: [revamp]
  pull_request:
    branches: [revamp]
  workflow_dispatch: {}

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  STAGING_ORG: ${{ secrets.VERCEL_ORG_ID }}
  STAGING_PROJECT: inclinedplane-staging

jobs:
  build:
    name: Build, verify, deploy
    # Pinned for the same reason as deploy.yml: Playwright 1.55 can't install
    # Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Build (vite + head/body/sitemap/rss prerender)
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          # Staging shows "Verify before launch" badges on unverified claims.
          VITE_SITE_ENV: staging
        run: npm run build

      - name: Verify body prerender succeeded for ALL routes
        run: |
          set -e
          missing=0
          for file in $(find dist -name index.html | sort); do
            if ! grep -q '<noscript>' "$file"; then
              echo "::error::$file is missing <noscript> fallback — body snapshot for this route failed."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing route(s) failed body snapshot."
            exit 1
          fi
          echo "All $(find dist -name index.html | wc -l) prerendered routes have body content."

      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${STAGING_ORG}" ]; then
            echo "::notice::Staging deploy skipped: Vercel secrets unavailable (fork PR or secrets not set)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Link staging project (creates it on first run)
        if: steps.secrets.outputs.deploy == 'true'
        run: |
          set -e
          npm install --global vercel@latest
          tmp=$(mktemp -d)
          if ! (cd "$tmp" && vercel link --yes --project "$STAGING_PROJECT" --scope "$STAGING_ORG" --token "$VERCEL_TOKEN"); then
            echo "::error::Could not link/create Vercel project '$STAGING_PROJECT'. The VERCEL_TOKEN secret is probably scoped to the production project only. Fix: vercel.com/account/tokens -> create a token with scope = the account that owns production -> run: gh secret set VERCEL_TOKEN -R InclinedPlane-AI/inclinedplane"
            exit 1
          fi
          mkdir -p .vercel
          cp "$tmp/.vercel/project.json" .vercel/project.json
          pid=$(node -p "require('./.vercel/project.json').projectId")
          # Public previews (they're noindex). Non-fatal if the API refuses.
          curl -fsS -X PATCH "https://api.vercel.com/v9/projects/${pid}?teamId=${STAGING_ORG}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" \
            -d '{"ssoProtection":null}' > /dev/null \
            && echo "Preview protection off for $STAGING_PROJECT" \
            || echo "::warning::Could not turn off preview protection; previews may require a Vercel login."

      - name: Package prebuilt artifact (noindex)
        if: steps.secrets.outputs.deploy == 'true'
        run: |
          vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${VERCEL_TOKEN}
          node scripts/vercel-output.mjs --noindex

      - name: Deploy staging (push to revamp)
        if: steps.secrets.outputs.deploy == 'true' && github.event_name != 'pull_request'
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${VERCEL_TOKEN})
          echo "Staging deployed: $url"
          echo "### Staging deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy PR preview
        id: preview
        if: steps.secrets.outputs.deploy == 'true' && github.event_name == 'pull_request'
        run: |
          url=$(vercel deploy --prebuilt --token=${VERCEL_TOKEN})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const marker = '<!-- staging-preview -->';
            const body = `${marker}\n**Preview deploy:** ${url}\n\nCommit: ${context.sha.slice(0, 7)} · noindex`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
